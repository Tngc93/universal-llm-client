name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests (fake provider servers, no network)
        run: npm test
      - name: Examples run offline with the mock provider
        run: |
          node examples/quickstart.mjs
          node examples/structured-output.mjs
          node examples/streaming.mjs
          node examples/fallback-chain.mjs

  types:
    name: Type definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tsc --noEmit on typecheck/index.ts
        run: npx -y -p typescript@5.6.3 tsc -p tsconfig.json
